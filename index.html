<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sõnavara kontroll</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Hajusrakenduste sõnavara kontroll</h1>
</header>

<main>
    <div class="word-box">
        <span class="label">Sõna:</span>
        <span id="ee-word" class="word"></span>
    </div>

    <input type="text" id="ee-answer" placeholder="Sisesta tõlge vene keeles">

    <div class="buttons">
        <button id="ee-check">Kontrolli</button>
        <button id="ee-refresh">Uus sõna</button>
    </div>

    <p id="ee-result" class="result"></p>
</main>

<script src="index.js"></script>
</body>
</html>
